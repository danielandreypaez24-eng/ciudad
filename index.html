/* ===== Animaciones de apertura y cierre ===== */
@keyframes aFade{from{opacity:0}to{opacity:1}}@keyframes aFadeO{from{opacity:1}to{opacity:0}}
@keyframes aSideIn{from{transform:translateX(-100%)}to{transform:none}}@keyframes aSideOut{from{transform:none}to{transform:translateX(-100%)}}
@keyframes aUpIn{from{transform:translateY(100%)}to{transform:none}}@keyframes aUpOut{from{transform:none}to{transform:translateY(100%)}}
@keyframes aPopIn{from{opacity:0;transform:translateY(18px) scale(.93)}to{opacity:1;transform:none}}@keyframes aPopOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(14px) scale(.95)}}
@keyframes aScrIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}@keyframes aScrOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(22px)}}
.sheet{animation:aFade .22s ease backwards}
.sheet>.panel.side{animation:aSideIn .32s cubic-bezier(.2,.85,.25,1) backwards}
.sheet>.panel.bot{animation:aUpIn .32s cubic-bezier(.2,.85,.25,1) backwards}
.sheet>.panel:not(.side):not(.bot){animation:aPopIn .28s cubic-bezier(.2,.9,.3,1.15) backwards}
.scr{animation:aScrIn .3s cubic-bezier(.2,.85,.25,1) backwards}
.sheet.out{animation:aFadeO .22s ease both;pointer-events:none}
.sheet.out>.panel.side{animation:aSideOut .23s ease-in both}
.sheet.out>.panel.bot{animation:aUpOut .23s ease-in both}
.sheet.out>.panel:not(.side):not(.bot){animation:aPopOut .2s ease-in both}
.scr.out{animation:aScrOut .22s ease-in both;pointer-events:none}
.na:not(.out),.na:not(.out)>.panel{animation:none!important}
@media(prefers-reduced-motion:reduce){.sheet,.sheet>.panel,.scr{animation:none!important}}

/* simulación determinista: ambos clientes obtienen el mismo resultado */
function rng(a){a>>>=0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function sim(id,ta,tb,ua,ub){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;const R=rng(h),T={a:ta.map(x=>({...x,c:x.hp})),b:tb.map(x=>({...x,c:x.hp}))},ev=[];
 const K={a:{v:(ua&&ua.v)|0,b:(ua&&ua.b)|0},b:{v:(ub&&ub.v)|0,b:(ub&&ub.b)|0}},used={a:{v:0,b:0},b:{v:0,b:0}};
 for(let r=0;r<40;r++){for(const s of['a','b']){const o=s=='a'?'b':'a';T[s].forEach((u,i)=>{if(u.c<=0)return;const al=T[o].map((x,j)=>j).filter(j=>T[o][j].c>0);if(!al.length)return;
  /* curación: usar un suministro cuenta como la acción del héroe */
  let w=-1;T[s].forEach((x,j)=>{if(x.c>0&&(w<0||x.c/x.hp<T[s][w].c/T[s][w].hp))w=j});
  if(w>=0){const t=T[s][w],fal=t.hp-t.c;let it=null;
   if(K[s].b>0&&fal>=10&&t.c/t.hp<.5)it='b';else if(K[s].v>0&&fal>=3&&t.c/t.hp<.6)it='v';
   if(it){const hl=Math.min(fal,it=='b'?10:3);K[s][it]--;used[s][it]++;t.c+=hl;ev.push({s,i,o:s,j:w,d:0,heal:hl,it,hp:t.c});return}}
  const j=al[Math.floor(R()*al.length)],cr=R()<.2,d=Math.max(1,u.atk+(R()<.5?1:0))*(cr?2:1);T[o][j].c=Math.max(0,T[o][j].c-d);ev.push({s,i,o,j,d,cr,hp:T[o][j].c})})}
  const la=T.a.some(x=>x.c>0),lb=T.b.some(x=>x.c>0);if(!la||!lb)return{ev,w:la?'a':'b',used}}
 const sa=T.a.reduce((t,x)=>t+x.c,0),sb=T.b.reduce((t,x)=>t+x.c,0);return{ev,w:sa>=sb?'a':'b',used}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

 busy=false;const po=document.getElementById('pvpov');if(po)po.remove();

 for(const v of res.ev){const A=pcE(v.s,v.i),B=pcE(v.o,v.j);if(!A||!B)continue;
  if(v.heal){A.classList.add('atk');await wait(260);H[v.o][v.j].c=v.hp;B.querySelector('i').style.width=100*v.hp/H[v.o][v.j].hp+'%';B.querySelector('span.m:last-child').textContent='HP '+v.hp+'/'+H[v.o][v.j].hp;document.getElementById('pvl').innerHTML=`${nmOf(v.s,v.i)} usa ${v.it=='b'?'Botiquín':'Vendaje'} sobre ${nmOf(v.o,v.j)} <b style="color:#4cdf7a">+${v.heal} HP</b>`;await wait(380);A.classList.remove('atk');continue}

  H[v.o][v.j].c=v.hp;B.querySelector('i').style.width=100*v.hp/H[v.o][v.j].hp+'%';B.querySelector('span.m:last-child').textContent='HP '+v.hp+'/'+H[v.o][v.j].hp;if(v.hp<=0)B.classList.add('dead');
  document.getElementById('pvl').innerHTML=`${nmOf(v.s,v.i)} golpea a ${nmOf(v.o,v.j)} <b>-${v.d}</b>${v.cr?' ¡crítico!':''}${v.hp<=0?' · cae':''}`;
  await wait(380);A.classList.remove('atk');B.classList.remove('hit')}
 document.getElementById('pvl').innerHTML=(res.w==mine?'<b>¡Victoria!</b>':'<b>Derrota</b>')+(res.used[mine].v+res.used[mine].b?`<br><span class="m">Gastaste ${res.used[mine].b} botiquín(es) y ${res.used[mine].v} vendaje(s).</span>`:'');
 try{if(S&&S.sup&&!r._spent){r._spent=1;S.sup.botiquin=Math.max(0,(S.sup.botiquin|0)-res.used[mine].b);S.sup.vendaje=Math.max(0,(S.sup.vendaje|0)-res.used[mine].v);save()}}catch(er){}
 const x=document.getElementById('pvx');x.classList.remove('hide');x.onclick=()=>{w.remove();C().endBattle(r.id)};

  break}}
function onB(side){return sn=>sn.docChanges().forEach(async c=>{if(c.type=='removed')return;const r={id:c.doc.id,...c.doc.data()},k=r.id+r.estado+r.t;
 if(bseen.has(k))return;bseen.add(k);if(Date.now()-(r.t||0)>120000)return;
 if(r.estado=='activa'){if(inB)return;inB=true;await window.Cloud.stopSearch();dispatchEvent(new CustomEvent('cloudbattle',{detail:{r,me:uid}}))}
 else if(side=='b'&&r.estado=='pendiente'){
  if(r.tipo=='publica'){if(searching&&!inB){try{await window.Cloud.acceptBattle(r.id)}catch(e){}}else{try{await updateDoc(doc(db,'batallas',r.id),{estado:'rechazada',t:Date.now()})}catch(e){}}}
  else dispatchEvent(new CustomEvent('cloudchallenge',{detail:{r}}))}
 else if(side=='a'&&r.estado=='rechazada'){pend.delete(r.id);try{await deleteDoc(doc(db,'batallas',r.id))}catch(e){}}})}
function listenB(){bun.forEach(f=>{try{f()}catch(e){}});const q=f=>query(collection(db,'batallas'),where(f,'==',uid));
 bun=[onSnapshot(q('a'),onB('a'),e=>console.warn('bat',e)),onSnapshot(q('b'),onB('b'),e=>console.warn('bat',e))]}
Object.assign(window.Cloud,{
 admUid:null,admLoaded:false,
 canAdmin:()=>!!uid&&(!window.Cloud.admLoaded||!window.Cloud.admUid||window.Cloud.admUid===uid),
 async linkAdmin(){if(!uid||window.Cloud.admUid)return;window.Cloud.admUid=uid;try{await setDoc(doc(db,'config','admin'),{uid})}catch(e){window.Cloud.admUid=null}},
 async viewOf(u){const s=await getDoc(doc(db,'perfiles',u));return s.exists()?s.data():null},
 team,isSearching:()=>searching,
 supplies:()=>{try{const u=S.sup||{};return {v:Math.max(0,u.vendaje|0),b:Math.max(0,u.botiquin|0)}}catch(e){return {v:0,b:0}}},
 async startSearch(){if(!uid)throw new Error('Necesitas una cuenta.');if(!team().length)throw new Error('Equipa al menos un héroe.');
  inB=false;searching=true;pend.clear();const put=()=>setDoc(doc(db,'cola',uid),{uid,nombre:window.Cloud.name,estado:'buscando',t:Date.now()});
  await put();qi=setInterval(()=>put().catch(()=>{}),20000);
  cun=onSnapshot(query(collection(db,'cola'),where('estado','==','buscando')),tryMatch,e=>console.warn('cola',e))},
 async stopSearch(){searching=false;clearInterval(qi);if(cun){cun();cun=null}try{if(uid)await deleteDoc(doc(db,'cola',uid))}catch(e){}},
 async acceptBattle(id){const t=team();if(!t.length)throw new Error('Entra a una partida con un héroe equipado.');searching=false;
  await updateDoc(doc(db,'batallas',id),{estado:'activa',tb:t,ub:window.Cloud.supplies(),t:Date.now()})},
 async declineBattle(id){try{await deleteDoc(doc(db,'batallas',id))}catch(e){}},
 async challenge(o){const t=team();if(!t.length)throw new Error('Entra a una partida con un héroe equipado.');
  await setDoc(doc(db,'batallas',uid+'_'+o.uid),{a:uid,b:o.uid,aN:window.Cloud.name,bN:o.nombre,ta:t,ua:window.Cloud.supplies(),estado:'pendiente',tipo:'amistad',t:Date.now()})},
 async endBattle(id){inB=false;try{await deleteDoc(doc(db,'batallas',id))}catch(e){}}
});
onAuthStateChanged(auth,async u=>{
 if(u){uid=u.uid;musicListen();try{const a=await getDoc(doc(db,'config','admin'));window.Cloud.admUid=a.exists()?a.data().uid:null;window.Cloud.admLoaded=true}catch(e){}window.Cloud.name=(u.email||'').split('@')[0];
  window.LD&&LD.set(45,'Cargando tu cuenta…');try{await setDoc(doc(db,'jugadores',uid),{nombre:window.Cloud.name},{merge:true});window.LD&&LD.set(60,'Cargando tus partidas…');await pull()}catch(e){console.warn(e);refresh()}
  window.LD&&LD.set(80,'Cargando tu perfil…');
  try{await ensureProfile();listen()}catch(e){console.warn('perfil',e)}
  notify();refresh();window.LD&&LD.done()}
 else{unlisten();musicStop();uid=null;window.Cloud.name=null;window.Cloud.me=null;notify();refresh();window.LD&&LD.done()}});
/* ===== MÚSICA COMPARTIDA: el administrador publica y todas las cuentas reciben (trozos de ~900 KB en Firestore) ===== */
const MCH=900000,mid=k=>k.replace(/[^a-zA-Z0-9_-]/g,'_'),pid=(k,v,i)=>mid(k)+'_'+v+'_'+i;
let mun=null;
async function delParts(k,v,n){for(let i=0;i<n;i++){try{await deleteDoc(doc(db,'musicaPartes',pid(k,v,i)))}catch(e){}}}
Object.assign(window.Cloud,{
 async musicPut(k,file,tr,v,name){if(!uid)throw new Error('Necesitas iniciar sesión.');
  const buf=new Uint8Array(await file.arrayBuffer()),n=Math.max(1,Math.ceil(buf.length/MCH));
  let old=null;try{const o=await getDoc(doc(db,'musica',mid(k)));if(o.exists())old=o.data()}catch(e){}
  try{for(let i=0;i<n;i+=3){await Promise.all([0,1,2].filter(j=>i+j<n).map(j=>setDoc(doc(db,'musicaPartes',pid(k,v,i+j)),{k,v,i:i+j,d:Bytes.fromUint8Array(buf.subarray((i+j)*MCH,(i+j+1)*MCH))})))}
   await setDoc(doc(db,'musica',mid(k)),{k,name:name||file.name,size:file.size,tr,n,v,t:Date.now()})}
  catch(e){await delParts(k,v,n);throw new Error(e&&e.code=='permission-denied'?'Sin permiso: faltan las reglas de Firestore para la música (solo el administrador publica).':msg(e))}
  if(old&&old.v&&old.v!==v)delParts(k,old.v,old.n||0)},
 async musicBlob(x){const ps=await Promise.all(Array.from({length:x.n},(_,i)=>getDoc(doc(db,'musicaPartes',pid(x.k,x.v,i)))));
  return new Blob(ps.map(p=>{if(!p.exists())throw new Error('Falta un trozo');return p.data().d.toUint8Array()}),{type:'audio/mpeg'})},
 async musicTr(k,tr){await setDoc(doc(db,'musica',mid(k)),{tr},{merge:true})},
 async musicDel(k){const r=doc(db,'musica',mid(k)),o=await getDoc(r);await deleteDoc(r);if(o.exists())await delParts(k,o.data().v,o.data().n||0)}
});
Object.assign(window.Cloud,{
 async musicDiag(){if(!uid)return 'No hay sesión iniciada. Entra a tu cuenta e inténtalo otra vez.';
  const L=['Cuenta: '+window.Cloud.name];let adm=null;
  try{const a=await getDoc(doc(db,'config','admin'));adm=a.exists()?a.data().uid:null}catch(e){L.push('✗ No pude leer config/admin: '+(e.code||e.message))}
  if(!adm){try{await setDoc(doc(db,'config','admin'),{uid});adm=uid;window.Cloud.admUid=uid;L.push('✓ Tu cuenta no estaba registrada como administradora: ya la registré.')}catch(e){L.push('✗ No pude registrar al administrador: '+(e.code||e.message))}}
  else if(adm!==uid)L.push('✗ El administrador registrado es OTRA cuenta, por eso esta no puede publicar. En Firebase borra el documento config/admin, vuelve aquí y toca Probar nube.');
  else L.push('✓ Esta cuenta es la administradora.');
  try{await setDoc(doc(db,'musica','_prueba'),{k:'_prueba',t:Date.now()});await deleteDoc(doc(db,'musica','_prueba'));L.push('✓ Puedo escribir en la nube: todo listo para publicar.')}
  catch(e){L.push('✗ No puedo escribir en la nube ('+(e.code||e.message)+'). Revisa que publicaste las reglas nuevas en Firebase y que esta cuenta sea la administradora.')}
  return L.join('\n')}
});
function musicListen(){if(mun)return;mun=onSnapshot(collection(db,'musica'),sn=>dispatchEvent(new CustomEvent('cloudmusic',{detail:{fromCache:sn.metadata.fromCache,list:sn.docs.map(d=>d.data())}})),e=>console.warn('musica',e))}
function musicStop(){if(mun){mun();mun=null}}
const flush=()=>{for(const n of Object.keys(timers))sendNow(+n)};
addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush()});
refresh();
