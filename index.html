/* ===== Animaciones de apertura y cierre ===== */
@keyframes aFade{from{opacity:0}to{opacity:1}}@keyframes aFadeO{from{opacity:1}to{opacity:0}}
@keyframes aSideIn{from{transform:translateX(-100%)}to{transform:none}}@keyframes aSideOut{from{transform:none}to{transform:translateX(-100%)}}
@keyframes aUpIn{from{transform:translateY(100%)}to{transform:none}}@keyframes aUpOut{from{transform:none}to{transform:translateY(100%)}}
@keyframes aPopIn{from{opacity:0;transform:translateY(18px) scale(.93)}to{opacity:1;transform:none}}@keyframes aPopOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(14px) scale(.95)}}
@keyframes aScrIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}@keyframes aScrOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(22px)}}
.sheet{animation:aFade .22s ease backwards}
.sheet>.panel.side{animation:aSideIn .32s cubic-bezier(.2,.85,.25,1) backwards}
.sheet>.panel.bot{animation:aUpIn .32s cubic-bezier(.2,.85,.25,1) backwards}
.sheet>.panel:not(.side):not(.bot){animation:aPopIn .28s cubic-bezier(.2,.9,.3,1.15) backwards}
.scr{animation:aScrIn .3s cubic-bezier(.2,.85,.25,1) backwards}
.sheet.out{animation:aFadeO .22s ease both;pointer-events:none}
.sheet.out>.panel.side{animation:aSideOut .23s ease-in both}
.sheet.out>.panel.bot{animation:aUpOut .23s ease-in both}
.sheet.out>.panel:not(.side):not(.bot){animation:aPopOut .2s ease-in both}
.scr.out{animation:aScrOut .22s ease-in both;pointer-events:none}
.na:not(.out),.na:not(.out)>.panel{animation:none!important}
@media(prefers-reduced-motion:reduce){.sheet,.sheet>.panel,.scr{animation:none!important}}

const tipEl=document.createElement('div');tipEl.id='tip';document.body.appendChild(tipEl);
let tipFor=null;
function showTip(el){tipFor=el;tipEl.textContent=el.dataset.tip;tipEl.classList.add('on');const r=el.getBoundingClientRect(),w=tipEl.offsetWidth,h=tipEl.offsetHeight;let x=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2)),y=r.top-h-12,below=false;if(y<8){y=r.bottom+12;below=true}tipEl.style.left=x+'px';tipEl.style.top=y+'px';tipEl.style.setProperty('--ax',(r.left+r.width/2-x)+'px');tipEl.classList.toggle('below',below)}
function hideTip(){tipFor=null;tipEl.classList.remove('on')}
const TCH=matchMedia('(hover:none)').matches;
document.addEventListener('mouseover',e=>{if(TCH)return;const a=e.target.closest&&e.target.closest('.ab[data-tip]');if(a)showTip(a)});
document.addEventListener('mouseout',e=>{if(TCH)return;const a=e.target.closest&&e.target.closest('.ab[data-tip]');if(a)hideTip()});
document.addEventListener('focusin',e=>{const a=e.target.closest&&e.target.closest('.ab[data-tip]');if(a)showTip(a)});
document.addEventListener('focusout',hideTip);
document.addEventListener('click',e=>{if(!TCH)return;const a=e.target.closest&&e.target.closest('.ab[data-tip]');if(a){tipFor===a?hideTip():showTip(a)}else hideTip()});
document.addEventListener('scroll',hideTip,true);
/* teclado (computador) */

<script>
/* ===== ARENA: 8 rangos con estrellas, temporadas, prestigio, perfil, clasificación y amistades =====
   Datos de la cuenta: S.arena (dentro de la partida, usa el mismo guardado/nube) + copia pública en perfiles/{uid}.arena.
   Todo lo ajustable está en CFG. Reemplaza el viejo sistema S.rk (que se conserva intacto y se migra una sola vez). */
(function(){
'use strict';
const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),C=()=>window.Cloud,$$=id=>document.getElementById(id);
/* ---------- CONFIGURACIÓN (todo editable aquí) ---------- */
const CFG={
 /* [nombre, nº de estrellas, color] — Solario/Filario/Diamantino usan los colores de las monedas del juego */
 tiers:[['Aspirante',5,'#9aa3ad'],['Solario',5,'var(--k-solar)'],['Filario',5,'var(--k-filar)'],['Viridiano',5,'#3fae6a'],['Diamantino',5,'var(--k-diamantino)'],['Ascendente',6,'#38b6d9'],['Histórico',6,'#d9455f'],['Valhárico',7,'#f0e2a8']],
 /* requisito de la estrella i: puntos acumulados (suben cada vez más) + victorias totales + % de victorias en rangos altos */
 req:{ptsBase:50,ptsStep:5,winsK:.5,winsQ:.02,wr:[0,0,0,0,0,.45,.5,.55],wrMin:20},
 /* puntos por duelo: base + ajuste por diferencia de nivel (rival - tú, en estrellas). Nunca bloquea el emparejamiento */
 win:{base:25,adjPer:2,adjMin:-10,adjMax:15},
 loss:{base:15,adjPer:1.5,min:5,max:25},
 protectTier:true, /* una derrota no te baja de la primera estrella de tu rango */
 pr:{win:30,loss:10,upset:10,upsetGap:2}, /* prestigio: victoria / derrota / bono por ganar a alguien 2+ estrellas arriba */
 reward:{star:1,tier:3}, /* diamantino por estrella nueva / por rango nuevo */
 season:{start:Date.UTC(2026,9,30),days:30,rewards:[[1000,15],[500,8],[200,4],[50,2],[1,1]]}, /* [prestigio mínimo, diamantino] */
 hist:15
};
const ROM=['I','II','III','IV','V','VI','VII'],LV=[];
CFG.tiers.forEach((t,ti)=>{for(let s=0;s<t[1];s++)LV.push({i:LV.length,t:ti,s,n:t[1],name:t[0]+' '+ROM[s],tn:t[0],c:t[2]})});
const N=LV.length,PTS=[0],WINS=[0],tStart=t=>LV.findIndex(x=>x.t==t);
for(let i=1;i<N;i++){PTS[i]=PTS[i-1]+CFG.req.ptsBase+CFG.req.ptsStep*i;WINS[i]=Math.round(i*CFG.req.winsK+i*i*CFG.req.winsQ)}
const meets=(a,i)=>{const g=a.w+a.l;return a.p>=PTS[i]&&a.w>=WINS[i]&&(g<CFG.req.wrMin||a.w/g>=CFG.req.wr[LV[i].t])};
const levelOf=a=>{for(let i=N-1;i>0;i--)if(meets(a,i))return i;return 0};
const needs=(a,i)=>{const g=a.w+a.l,r=[['Puntos',a.p,PTS[i]],['Victorias',a.w,WINS[i]]],w=CFG.req.wr[LV[i].t];if(w)r.push(['% victorias',g?Math.round(100*a.w/g):0,Math.round(w*100)]);return r};
/* ---------- temporadas ---------- */
const SD=CFG.season.days*864e5,seasonN=(t=Date.now())=>Math.max(1,Math.floor((t-CFG.season.start)/SD)+1),sStart=n=>CFG.season.start+(n-1)*SD,sEnd=n=>CFG.season.start+n*SD,pad=n=>String(n).padStart(2,'0');
const SIP=['M13.2 2L5 13.4h5.4L9.6 22 19 9.8h-5.6z','M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z','M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.4 2-4.6.2 1.4.9 2.2 1.6 2.6C10 8 11 5 12 2z','M12 2.5l8 9.5-8 9.5-8-9.5z','M12 2l2.2 6.3L21 9.5l-5 4.2 1.6 6.8L12 16.8 6.4 20.5 8 13.7 3 9.5l6.8-1.2z','M3 18l-1-11 5 4 5-8 5 8 5-4-1 11z'],SCOL=['#e8a33a','#7a8cf0','#e5684a','#46c2b4','#c95fd0','#8fc84a'];
const sIcon=(n,z)=>`<svg viewBox="0 0 24 24" width="${z}" height="${z}" fill="currentColor" style="color:${SCOL[(n-1)%6]}"><path d="${SIP[(n-1)%6]}"/></svg>`;
const seasonRw=pr=>{for(const[r,v]of CFG.season.rewards)if(pr>=r)return v;return 0};
/* ---------- datos ---------- */
function ensure(){if(typeof S==='undefined'||!S||S.slot==null||!S.coins)return null;let a=S.arena;
 if(!a||a.v!==1){const o=S.rk;a=S.arena={v:1,p:Math.max(0,(o&&o.p)|0),w:Math.max(0,(o&&o.w)|0),l:0,h:[],ids:[],sea:null,past:[],pv:true,mig:o?1:0}} /* migración: S.rk queda intacto */
 if(!Array.isArray(a.h))a.h=[];if(!Array.isArray(a.ids))a.ids=[];if(!Array.isArray(a.past))a.past=[];
 const n=seasonN();if(!a.sea)a.sea={n,pr:0,w:0,l:0};
 if(a.sea.n<n){const c=a.sea;
  if(c.w+c.l>0&&!a.past.some(r=>r.n==c.n)){const rw=seasonRw(c.pr),rec={n:c.n,pr:c.pr,w:c.w,l:c.l,lv:levelOf(a),pos:null,rw,s:sStart(c.n),e:sEnd(c.n)};a.past.push(rec);S.coins.diamantino=(S.coins.diamantino||0)+rw;a.fx=c.n;fetchPos(rec)}
  a.sea={n,pr:0,w:0,l:0};try{save();coins()}catch(e){}}
 return a}
async function fetchPos(rec){try{if(!C()||!C().top||!C().name)return;const r=(await C().top('pr',100)).filter(d=>d.arena&&d.arena.sn==rec.n).sort((x,y)=>y.arena.pr-x.arena.pr),k=r.findIndex(d=>d.nombre===C().name);if(k>=0&&rec.pos==null){rec.pos=k+1;save()}}catch(e){}}
const pub=a=>({lv:levelOf(a),p:a.p,w:a.w,l:a.l,sn:a.sea.n,pr:a.sea.pr,past:a.past.map(r=>({n:r.n,pr:r.pr,lv:r.lv,pos:r.pos,w:r.w,l:r.l,rw:r.rw})),h:a.h,pv:a.pv!==false});
let lastPub='',lastNm=null;
function push(){const a=ensure();if(!a||!C()||!C().name||!C().arenaPut)return;if(lastNm!==C().name){lastNm=C().name;lastPub=''}const p=pub(a),k=JSON.stringify(p);if(k===lastPub)return;lastPub=k;C().arenaPut(p).catch(()=>{lastPub=''})}
/* ---------- resultado de un duelo (fórmula centralizada) ---------- */
window.arenaDuel=async o=>{const a=ensure();if(!a||a.ids.includes(o.id))return null;a.ids.push(o.id);a.ids=a.ids.slice(-40);
 let ol=null;try{const p=await Promise.race([C().viewOf(o.oppUid),new Promise(r=>setTimeout(()=>r(null),2500))]);if(p&&p.arena&&Number.isFinite(p.arena.lv))ol=clamp(p.arena.lv|0,0,N-1)}catch(e){}
 const b=levelOf(a),diff=(ol==null?b:ol)-b;let d,pr;
 if(o.won){d=clamp(Math.round(CFG.win.base+diff*CFG.win.adjPer),CFG.win.base+CFG.win.adjMin,CFG.win.base+CFG.win.adjMax);pr=CFG.pr.win+(diff>=CFG.pr.upsetGap?CFG.pr.upset:0);a.w++;a.sea.w++}
 else{d=-clamp(Math.round(CFG.loss.base-diff*CFG.loss.adjPer),CFG.loss.min,CFG.loss.max);pr=CFG.pr.loss;a.l++;a.sea.l++}
 const fl=o.won||!CFG.protectTier?0:PTS[tStart(LV[b].t)],np=Math.max(fl,a.p+d);d=np-a.p;a.p=np;a.sea.pr+=pr;
 const af=levelOf(a);let rw=0,up=null;
 for(let k=Math.max(b,a.best|0)+1;k<=af;k++)rw+=LV[k].s==0?CFG.reward.tier:CFG.reward.star; /* solo se cobra por superar tu nivel máximo */
 a.best=Math.max(a.best|0,af);
 if(rw)S.coins.diamantino=(S.coins.diamantino||0)+rw;
 if(LV[af].t>LV[b].t)up={from:LV[b],to:LV[af],rw};
 a.h.unshift({id:String(o.id).slice(-6),w:o.won?1:0,o:String(o.oppName||'Rival').slice(0,20),ol,d,pr,t:Date.now()});a.h=a.h.slice(0,CFG.hist);
 try{save();coins()}catch(e){}push();
 return{won:!!o.won,gain:d,pr,star:af>b,up,rw,from:LV[b],now:LV[af],season:a.fx||null}};
/* compat: el viejo hook de victoria ya no se usa */
window.rkWin=()=>null;
window.RK={LV,PTS,WINS,CFG,levelOf,badge:null};
/* ---------- insignias, estrellas, tarjetas ---------- */
const BG=['M12 9a2.8 2.8 0 1 0 0 5.6a2.8 2.8 0 1 0 0-5.6z','M12 7.4l4.4 4.4-4.4 4.4-4.4-4.4z','M7.5 9.5L12 7l4.5 2.5v1.6L12 8.6 7.5 11.1zM7.5 13.4L12 10.9l4.5 2.5V15L12 12.5 7.5 15z','M12 6.8c3.6 0 5 2.4 5 4.8-2.6.4-4.4 1.8-5 4.4-2.8-.4-4.6-2.2-5-4.6.4-2.4 2.2-4.6 5-4.6z','M8.5 8.6h7l2.2 2.8L12 17.2 6.3 11.4zM9.9 10.1l-.9 1.3h6l-.9-1.3z','M12 6.6l4.8 5.2h-3.2v4.4h-3.2v-4.4H7.2z','M7 16.4V9.2h1.8v7.2zM11.1 16.4V9.2h1.8v7.2zM15.2 16.4V9.2H17v7.2zM6.4 7.6L12 5.2l5.6 2.4v1.1H6.4z','M6.2 16.4l-.8-7.2 3.6 2.8L12 7.2l3 4.8 3.6-2.8-.8 7.2z'];
const badge=(t,z=34)=>`<svg class="abg" viewBox="0 0 24 24" width="${z}" height="${z}" style="color:${CFG.tiers[t][2]}"><path d="M12 1.8l8.6 3v7c0 5-3.6 8.6-8.6 10.4C7 20.4 3.4 16.8 3.4 11.8v-7z" fill="currentColor" fill-opacity=".16" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="${BG[t]}" fill="currentColor" fill-rule="evenodd"/></svg>`;
const STP='M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2 6.3 20.3l1.2-6.4L2.8 9.5l6.4-.8z';
const stars=(i,nw)=>{const L=LV[i];let h='';for(let k=0;k<L.n;k++)h+=`<svg class="as ${k<=L.s?'on':''}${nw&&k==L.s?' nw':''}" viewBox="0 0 24 24" width="13" height="13"><path d="${STP}"/></svg>`;return h};
const av=(c,n,z)=>`<span class="av" style="width:${z}px;height:${z}px;font-size:${Math.round(z*.46)}px;background:${esc(c||'#3a5a8a')}">${esc((n||'?')[0])}</span>`;
function card(i,p,x){x=x||{};const L=LV[i],nx=i<N-1?i+1:null,bar=nx==null?100:clamp(100*(p-PTS[i])/(PTS[nx]-PTS[i]),0,100);
 return `<div class="rkc" style="--rc:${L.c}"><span class="rkb">${badge(L.t,40)}</span><div class="rkm"><div class="rkn"><b>${L.name}</b><em>${p} pts</em></div><div class="sts">${stars(i,x.nw)}</div><div class="rkbar"><i style="width:${bar}%"></i></div>${x.sub?`<span class="m">${x.sub}</span>`:''}</div></div>`}
const fdate=t=>new Date(t).toLocaleString('es',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const daysLeft=()=>Math.max(0,Math.ceil((sEnd(seasonN())-Date.now())/864e5));
function seasonBox(A){const n=seasonN(),pr=A&&A.sn==n?A.pr:0;return `<div class="asn"><span class="asi">${sIcon(n,34)}</span><div><b>TEMPORADA ${pad(n)}</b><div class="m">Termina en ${daysLeft()} día(s)</div></div><div class="aspr"><b>${pr}</b><span class="m">prestigio</span></div></div>`}
function statsGrid(A){const g=A.w+A.l,wr=g?Math.round(100*A.w/g):0;return `<div class="ast"><div><b>${A.p}</b><span>Puntos de Arena</span></div><div><b>${A.w}</b><span>Victorias</span></div><div><b>${A.l}</b><span>Derrotas</span></div><div><b>${wr}%</b><span>% victorias</span></div></div><div class="rkbar" style="--rc:#3fae6a"><i style="width:${wr}%"></i></div>`}
function histRows(A){const h=A.h||[];return h.length?h.map(x=>`<div class="dr ${x.w?'w':'l'}"><div class="drm"><b>${x.w?'VICTORIA':'DERROTA'}</b> <span class="m">vs ${esc(x.o)}${x.ol!=null&&LV[x.ol]?' · '+LV[x.ol].name:''}</span><div class="m">#${esc(x.id)} · ${fdate(x.t)}</div></div><div class="drr"><b class="${x.d>=0?'up':'dn'}">${x.d>0?'+':''}${x.d} pts</b><span class="m">+${x.pr} prestigio</span></div></div>`).join(''):'<p class="m">Aún no hay duelos competitivos.</p>'}
function seasonHist(A){const p=(A.past||[]).slice().reverse();return p.length?p.map(r=>`<div class="shr"><span class="asi">${sIcon(r.n,26)}</span><div class="drm"><b>Temporada ${pad(r.n)}</b><div class="m">${r.pr} prestigio · ${r.w}V/${r.l}D</div></div><div class="drr"><span style="color:${LV[r.lv]?LV[r.lv].c:'inherit'}">${LV[r.lv]?badge(LV[r.lv].t,18)+' '+LV[r.lv].name:'—'}</span><span class="m">${r.pos?'Posición #'+r.pos:'Sin posición'}</span></div></div>`).join(''):'<p class="m">Aún no hay temporadas finalizadas.</p>'}
const PF={
 ring:(w,l)=>{const g=w+l,pc=g?w/g:0,R=34,C2=2*Math.PI*R;return `<svg class="pf-ring" viewBox="0 0 84 84" width="84" height="84"><circle cx="42" cy="42" r="${R}" fill="none" stroke="var(--l)" stroke-width="8"/><circle cx="42" cy="42" r="${R}" fill="none" stroke="#3fae6a" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(C2*pc).toFixed(1)} ${C2.toFixed(1)}" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor">${Math.round(pc*100)}%</text></svg>`},

 mini:v=>{const m={};(v.b||[]).forEach(t=>{m[t[1]+','+t[2]]=t[0]=='mur'?2:1});let h='';for(let i=0;i<225;i++){const k=m[(i%15)+','+((i/15)|0)];h+=`<i class="${k==2?'w':k?'b':''}"></i>`}return `<div class="pf-mini">${h}</div>`},
 tile:(v,t,c)=>`<div class="pf-t"${c?` style="--tc:${c}"`:''}><b>${v}</b><span>${t}</span></div>`,

/* ===== Pantalla de héroes (con Centro de Héroes construido): minimalista ===== */
.hx{display:flex;flex-direction:column;gap:12px;max-width:760px;margin:0 auto;padding-bottom:12px}
.hx-st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.hx-sl{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 6px 10px;min-height:118px;border:1px solid color-mix(in srgb,var(--hc,var(--a)) 55%,transparent);border-radius:14px;background:linear-gradient(180deg,color-mix(in srgb,var(--hc,var(--a)) 14%,transparent),transparent);text-align:center;cursor:pointer;min-width:0;box-sizing:border-box}

.hx-sn{position:absolute;top:6px;left:9px;font-size:10px;font-weight:700;color:var(--hc,var(--a));opacity:.85}
.hx-plus{font-size:24px;line-height:1}.hx-sm{font-size:10px;color:var(--m);line-height:1.2}
.hx-sl b{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hx-av{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:color-mix(in srgb,var(--hc,var(--a)) 18%,transparent);border:1px solid color-mix(in srgb,var(--hc,var(--a)) 50%,transparent)}
.hx-mini{display:block;width:78%;height:4px;border-radius:9px;background:color-mix(in srgb,var(--t) 10%,transparent);overflow:hidden}.hx-mini i{display:block;height:100%;border-radius:9px}
.hx-mini.r i{background:var(--r)}.hx-mini.b i{background:var(--b)}
.hx-dd{position:absolute;left:6px;right:6px;bottom:6px;font-size:9px;padding:2px 4px;border-radius:7px;background:color-mix(in srgb,var(--r) 88%,#000);color:#fff}
.hx-bar{display:flex;gap:8px;align-items:center;justify-content:space-between}
.hx-bar button{flex:1;padding:9px 8px;font-size:12px;border-radius:11px}
.hx-list{display:grid;grid-template-columns:1fr;gap:10px}
.hx-c{border:1px solid var(--l);border-left:4px solid var(--hc);border-radius:14px;background:linear-gradient(110deg,color-mix(in srgb,var(--hc) 9%,transparent),transparent 65%);overflow:hidden}
.hx-c.on{border-color:color-mix(in srgb,var(--hc) 60%,transparent);border-left-color:var(--hc)}
.hx-h{display:flex;align-items:center;gap:11px;padding:12px;cursor:pointer}
.hx-h .hx-av{width:42px;height:42px;border-radius:12px}
.hx-i{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.hx-n{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.hx-n b{font-size:14px}
.hx-t{font-size:10px;padding:2px 7px;border-radius:99px;border:1px solid var(--l);color:var(--m);letter-spacing:.04em}
.hx-t.a{border-color:color-mix(in srgb,var(--a) 60%,transparent);color:var(--a)}.hx-t.r{border-color:color-mix(in srgb,var(--r) 60%,transparent);color:var(--r)}
.hx-sub{font-size:11px;color:var(--m)}
.hx-cv{flex:none;width:18px;height:18px;color:var(--m);transition:transform .2s}.hx-c.open .hx-cv{transform:rotate(180deg)}
.hx-bs{display:flex;flex-direction:column;gap:6px;padding:0 12px 12px}
.hx-br{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;font-size:10px}
.hx-bl{color:var(--m);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.hx-bt{height:6px;border-radius:99px;background:color-mix(in srgb,var(--t) 10%,transparent);overflow:hidden}.hx-bt i{display:block;height:100%;border-radius:99px}
.hx-bv{color:var(--t);font-variant-numeric:tabular-nums;min-width:56px;text-align:right}
.hx-br.r i{background:var(--r)}.hx-br.b i{background:var(--b)}.hx-br.x i{background:var(--a)}
.hx-d{display:none;flex-direction:column;gap:9px;padding:12px;border-top:1px solid var(--l)}.hx-c.open .hx-d{display:flex}
.hx-k{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.hx-k>div{display:flex;flex-direction:column;gap:1px;padding:8px 6px;border-radius:10px;background:color-mix(in srgb,var(--t) 5%,transparent);text-align:center;min-width:0}
.hx-k b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hx-k span{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--m)}
.hx-sr{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;font-size:11px}
.hx-sr>span:first-child{color:var(--m)}.hx-sr em{font-style:normal;font-size:10px;color:var(--t);font-variant-numeric:tabular-nums}
.hx-seg{display:flex;gap:3px}.hx-seg i{flex:1;height:6px;border-radius:3px;background:color-mix(in srgb,var(--t) 10%,transparent)}.hx-seg i.on{background:var(--hc)}
.hx-ch{display:flex;flex-wrap:wrap;gap:5px}
.hx-d p{margin:0;font-size:11px;line-height:1.4;color:var(--m)}
.hx-ac{display:grid;grid-template-columns:1fr 1fr;gap:6px}.hx-ac button{padding:9px 4px;font-size:12px;border-radius:10px}
.hx-empty{padding:22px 14px;border:1.5px dashed var(--l);border-radius:14px;text-align:center;color:var(--m);font-size:12px}
@media(min-width:900px){.hx-list{grid-template-columns:repeat(2,1fr)}}

<script id="patch-tg-hx-js">
(function(){

/* ================= TUTORIAL CON FOCO ================= */
let layer=null,curKey='',lastSig='',shown=false,curNext=0;
function mk(){
 if(layer)return;
 layer=document.createElement('div');layer.id='tg';
 layer.innerHTML='<i class="tgb" data-p="t"></i><i class="tgb" data-p="b"></i><i class="tgb" data-p="l"></i><i class="tgb" data-p="r"></i><div class="tgh"></div><div class="tgc"><div class="tgk"></div><p class="tgx"></p><button class="tgn" type="button" style="display:none">Siguiente</button><button class="tgs" type="button">Omitir guía</button><i class="tga"></i></div>';

 const nudge=()=>{const c=layer.querySelector('.tgc');c.classList.remove('nd');void c.offsetWidth;c.classList.add('nd')};
 layer.querySelectorAll('.tgb').forEach(b=>b.addEventListener('click',nudge));
 layer.querySelector('.tgs').addEventListener('click',()=>{if(S){S.tgoff=1;try{save()}catch(e){}}hide()});
 layer.querySelector('.tgn').addEventListener('click',()=>{if(!S||!curNext)return;if(curNext==1)S.tn=1;else{S.tn=2;S.step=11;S.ms=11}try{save()}catch(e){}curNext=0;lastSig='';curKey=''});
}

const vis=e=>{if(!e||e.classList.contains('hide'))return false;const r=e.getBoundingClientRect();return r.width>2&&r.height>2&&getComputedStyle(e).visibility!=='hidden'};
const T=(els,k,x,o)=>Object.assign({els:[].concat(els).filter(Boolean),k,x},o||{});

function find(){
 const g=document.getElementById('game');
 if(typeof S==='undefined'||!S||!g||g.classList.contains('hide')||S.tgoff)return null;
 const st=S.step;if(st>=11||st==null)return null;
 if(typeof B!=='undefined'&&B&&!B.over&&B.tut)return null;
 const o=ovE(),fc=o.firstElementChild,open=!!fc&&!fc.classList.contains('out');
 const inO=s=>open?o.querySelector(s):null;
 const cellOf=b=>b?Q(`#grid .c[data-x="${b.x}"][data-y="${b.y}"]`):null;
 const lastB=t=>[...S.b].reverse().find(b=>b.type==t);
 const shopOpen=!!inO('.shr'),estOpen=!!inO('button[onclick="shop()"]')&&!shopOpen;
 const closeBtn=()=>inO('.menu .mx')||inO('.mx')||inO('.pmf button:last-child')||inO('.panel p button')||inO('.sh button');
 const tab=()=>vis(Q('#ta'))?Q('#ta'):(vis(Q('#n3'))?Q('#n3'):null);
 const buyBtn=k=>{const b=inO(`button[onclick="buy('${k}')"]`);return b};

 const step=n=>'Paso '+n+' · ';

 if(place&&!open)return T([Q('#view'),Q('#bar')],'Colocación',place=='est'?'Toca una casilla libre del mapa para construir tu establecimiento.':'Toca una casilla libre del mapa para colocar la construcción.');

 switch(st){
  case 0:return T(Q('#ta'),step(1)+'Inicio','Toca «Construir» y después elige una casilla del mapa.');
  case 1:{const c=cellOf(S.b.find(b=>b.type=='est'));return T(c,step(2)+'Construyendo','Tu establecimiento estará listo en unos segundos.',{soft:true})}
  case 2:{if(open)return T(closeBtn(),step(3)+'Cerrar','Cierra esta ventana para continuar.');
   return T(cellOf(S.b.find(b=>b.type=='est')),step(3)+'Establecimiento','Toca tu establecimiento para abrir su menú.')}
  case 3:{if(shopOpen){const b=buyBtn('sol');return T(b,step(4)+'Torre solar','Compra la torre solar y luego colócala en el mapa.'+lack(b))}
   if(estOpen)return T(inO('button[onclick="shop()"]'),step(4)+'Tienda','Abre la Tienda.');
   if(open)return T(closeBtn(),step(4)+'Cerrar','Cierra esta ventana para continuar.');
   return T(tab(),step(4)+'Tienda','Abre la tienda y compra la torre solar.')}
  case 4:{if(open)return T(closeBtn(),step(5)+'Cerrar','Cierra esta ventana para continuar.');
   return T(Q('#mb'),step(5)+'Menú','Toca las tres rayas de arriba a la izquierda para abrir el menú.')}
  case 5:{if(inO('.menu'))return T(inO('.menu .mx'),step(5)+'Menú','Este es tu menú: aquí ves tus monedas y tus estructuras. Míralo con calma y, cuando termines, toca la ✕ para seguir.',{soft:true,pos:'bottom'});
   if(shopOpen){const b=buyBtn('fil');return T(b,step(6)+'Torre filar','Compra la torre filar y luego colócala en el mapa.'+lack(b))}
   if(open)return T(closeBtn(),step(6)+'Cerrar','Cierra esta ventana para continuar.');
   return T(tab(),step(6)+'Tienda','Abre la tienda y compra la torre filar.')}
  case 6:case 7:{const hn=inO('#hn');if(hn)return T(inO('.panel'),step(8)+'Nombre','Escribe un nombre para tu héroe y toca «Entrenar».');
   const tb=inO('button[onclick="train()"]');if(tb)return T(tb,step(8)+'Entrenar','Toca «Entrenar aldeano» para convertirlo en tu primer héroe.'+lack(tb),{soft:true});
   if(st==7){if(!open&&S.heroes.length==0&&vis(Q('#n1')))return T(Q('#n1'),step(8)+'Héroes','Toca el botón de Héroes.',{soft:true});return null}
   if(open)return T(closeBtn(),step(7)+'Cerrar','Cierra esta ventana para continuar.');
   if(vis(Q('#n1')))return T(Q('#n1'),step(7)+'Héroes','Toca el botón de Héroes.',{soft:true});
   return T(cellOf(lastB('fil')),step(7)+'Construyendo','Espera a que termine la torre filar; luego aparecerá el botón de Héroes.',{soft:true})}
  case 10:{if(E()>=2)return null;const eb=S.b.find(b=>b.type=='est'),ph=S.tn||0;
   if(ph>=1)return T(inO('.reqs')||cellOf(eb),'¡Buena suerte!','Ya tienes libertad total: construye, entrena héroes y reúne los recursos para mejorar tu establecimiento. ¡Buena suerte!',{soft:true,next:2});
   if(open){const rq=inO('.reqs');if(rq&&inO('button[onclick^="upg("]'))return T(rq,'Mejorar establecimiento','Vamos a mejorar el establecimiento a nivel 2. Estos son los requisitos: debes cumplirlos todos para poder mejorarlo.',{soft:true,next:1});return T(closeBtn(),'Cerrar','Cierra esta ventana y toca tu establecimiento.',{soft:true})}
   return T(cellOf(eb),'Mejoras','¡Bien! Toca tu establecimiento para ver los requisitos de su mejora a nivel 2.',{soft:true})}
  default:{if(shopOpen){const b=buyBtn('als');return T(b,step(9)+'Almacén','Compra un almacén solar para guardar más monedas.'+lack(b))}
   if(open)return T(closeBtn(),step(9)+'Cerrar','Cierra esta ventana para continuar.');

 }

function paint(t){
 mk();
 const vw=innerWidth,vh=innerHeight,rs=t.els.map(e=>e.getBoundingClientRect());
 let x1=Math.min(...rs.map(r=>r.left)),y1=Math.min(...rs.map(r=>r.top)),x2=Math.max(...rs.map(r=>r.right)),y2=Math.max(...rs.map(r=>r.bottom));
 const pad=t.soft?4:6;x1=Math.max(0,x1-pad);y1=Math.max(0,y1-pad);x2=Math.min(vw,x2+pad);y2=Math.min(vh,y2+pad);
 const w=x2-x1,h=y2-y1,sig=[x1|0,y1|0,w|0,h|0,vw,vh,t.soft?1:0,t.k,t.x,t.next||0].join('|');
 if(!shown){layer.classList.add('on');shown=true}
 if(sig===lastSig)return;lastSig=sig;
 layer.classList.toggle('soft',!!t.soft);
 const set=(sel,l,tp,wd,ht)=>{const s=layer.querySelector(sel).style;s.left=l+'px';s.top=tp+'px';s.width=Math.max(0,wd)+'px';s.height=Math.max(0,ht)+'px'};
 set('.tgb[data-p=t]',0,0,vw,y1);set('.tgb[data-p=b]',0,y2,vw,vh-y2);set('.tgb[data-p=l]',0,y1,x1,h);set('.tgb[data-p=r]',x2,y1,vw-x2,h);
 set('.tgh',x1,y1,w,h);
 const c=layer.querySelector('.tgc');
 c.querySelector('.tgk').textContent=t.k;c.querySelector('.tgx').textContent=t.x;curNext=t.next||0;c.querySelector('.tgn').style.display=curNext?'block':'none';c.querySelector('.tgn').textContent=curNext==2?'Empezar':'Siguiente';
 const cw=c.offsetWidth,ch=c.offsetHeight,cx=x1+w/2;
 let left=Math.min(Math.max(12,cx-cw/2),vw-cw-12),top,mode;
 if(t.pos=='bottom'){top=vh-ch-12;mode=''}
 else if(y2+14+ch+12<=vh){top=y2+14;mode='up'}
 else if(y1-14-ch>=12){top=y1-14-ch;mode='dn'}
 else{top=Math.min(vh-ch-12,y1+12);mode=''}
 c.style.left=left+'px';c.style.top=top+'px';c.className='tgc '+mode;
 const a=c.querySelector('.tga');a.style.left=Math.min(Math.max(14,cx-left-6),cw-26)+'px';
}
function tick(){
 let t=null;try{t=find()}catch(e){t=null}
 if(t&&t.els.length&&t.els.every(e=>e&&e.isConnected)&&t.els.every(e=>{const r=e.getBoundingClientRect();return r.width>1&&r.height>1})){
  const k=t.k+'|'+t.x;
  if(k!==curKey){curKey=k;lastSig='';const e=t.els[0];if(e.closest&&e.closest('#ov'))try{e.scrollIntoView({block:'center',inline:'center'})}catch(_){}}
  paint(t);requestAnimationFrame(tick);
 }else{hide();setTimeout(tick,250)}
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',tick);else tick();

/* ================= PANTALLA DE HÉROES (Centro de Héroes construido) ================= */

const hxBar=(l,v,m,c,tx)=>`<div class="hx-br ${c}"><span class="hx-bl">${l}</span><span class="hx-bt"><i style="width:${pc(v,m)}%"></i></span><span class="hx-bv">${tx}</span></div>`;

 try{eqNorm(h)}catch(e){}

 return `<div class="hx-c${eqd?' on':''}${open?' open':''}" style="--hc:${col}">
  <div class="hx-h" onclick="hxTog(${h.id})"><span class="hx-av">${hic(h.cls,24)}</span>
   <div class="hx-i"><div class="hx-n"><b>${h.n}</b>${eqd?`<span class="hx-t a">Equipo ${ci+1}</span>`:''}${dead?`<span class="hx-t r">Inhabilitado ${Math.ceil((h.dead-Date.now())/1000)} s</span>`:''}</div><span class="hx-sub">${clsN(h)} · Nivel ${h.lv} · ATQ ${h.atk}</span></div>${chev}</div>
  <div class="hx-bs">${hxBar('HP',h.hp,h.mhp,'r',h.hp+'/'+h.mhp)}${hxBar('Maná',h.mp,h.mmp,'b',h.mp+'/'+h.mmp)}${hxBar('XP',mx?1:xp,mx?1:xn,'x',mx?'Nivel máx.':xp+'/'+xn)}</div>
  <div class="hx-d">
   <div class="hx-k"><div><b>${h.atk}</b><span>Ataque</span></div><div><b>${gp.n.replace('Golpe ','')}</b><span>Golpe</span></div><div><b>${c.pos}</b><span>Posición</span></div></div>
   ${hxRow('Mejora de vida',up.hp||0,UPMAX.hp)}${hxRow('Mejora de ataque',up.atk||0,UPMAX.atk)}${hxRow('Rango de golpe',gr(h),5)}${hxRow('Habilidades',(sk.l||[]).length,la)}
   ${hrr||g.w||g.a?hxRow('Arma',g.w||0,5)+hxRow('Armadura',g.a||0,5):''}

  </div></div>`;
}
function hxSlot(id,i){

const _heroes=heroes;
heroes=function(){
 if(!S||!centroListo())return _heroes.apply(this,arguments);
 SCR='heroes';HXB=false;

<script id="patch-cfg-js">
/* ===== CONFIGURACIÓN PARA TODOS (parte 1): música por sección, efectos, vibración y animaciones =====
   Se guarda en este dispositivo (localStorage 'ciudad-cfg'), vale para todas las partidas y está disponible
   en la pantalla de partidas, en la ciudad y durante los combates. */
(function(){
'use strict';
const SYSRM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const SECS=[['aldea','Aldea','Ciudad y mapa de aventuras'],['aventura','Aventuras','Niveles normales'],['jefe','Jefes','Combates contra jefes'],['duelo','Duelos','Batallas entre jugadores']];
const def=()=>({mus:{aldea:{on:true,v:100},aventura:{on:true,v:100},jefe:{on:true,v:100},duelo:{on:true,v:100}},anim:!SYSRM,vib:true});
let CFG=def();
try{const q=JSON.parse(localStorage.getItem('ciudad-cfg')||'null');if(q){
 SECS.forEach(([k])=>{const s=q.mus&&q.mus[k];if(s){CFG.mus[k].on=s.on!==false;if(typeof s.v=='number')CFG.mus[k].v=Math.max(0,Math.min(100,Math.round(s.v)))}});
 if(typeof q.anim=='boolean')CFG.anim=q.anim;if(typeof q.vib=='boolean')CFG.vib=q.vib}}catch(_){}
const save=()=>{try{localStorage.setItem('ciudad-cfg',JSON.stringify(CFG))}catch(_){}};
window.CFG=CFG;

/* ---------- música: volumen general × volumen de la sección que suena ---------- */
const secOf=k=>{k=k||'';return k.indexOf('duelo')==0?'duelo':k.indexOf('jefe')==0?'jefe':k=='aventura'?'aventura':'aldea'};
const secMult=k=>{const s=CFG.mus[secOf(k)];return s.on?s.v/100:0};
function applyMusic(){const M=window.MT;if(!M)return;const a=M.cur&&M.el&&M.el[M.cur];if(a&&!a.paused){clearInterval(a._iv);a.volume=Math.max(0,Math.min(1,M.MV))}}
if(window.MT){
 let master=window.MT.MV;
 Object.defineProperty(window.MT,'MV',{configurable:true,enumerable:true,get(){return Math.max(0,Math.min(1,master*secMult(window.MT.cur)))},set(v){master=v}});
 window.mtVol=function(v){master=Math.max(0,Math.min(1,v/100));try{localStorage.setItem('ciudad-mvol',master)}catch(_){}applyMusic();try{if(window.MT.pa)window.MT.pa.volume=master}catch(_){}};
 window.cfgMaster=()=>master;
}
/* música sintética de Yloka: si la sección «Jefes» está silenciada, no suena */
try{const _y=yMusic;yMusic=function(on){if(on&&secMult('jefe')===0)return;return _y.apply(this,arguments)}}catch(_){}

/* ---------- vibración ---------- */
try{const _v=navigator.vibrate&&navigator.vibrate.bind(navigator);if(_v)navigator.vibrate=function(p){return CFG.vib?_v(p):false}}catch(_){}

/* ---------- animaciones ---------- */
function applyAnim(){
 document.documentElement.classList.toggle('noanim',!CFG.anim);
 try{RM=!CFG.anim||SYSRM}catch(_){}}
{const _an=Element.prototype.animate;
 Element.prototype.animate=function(kf,o){
  if(!CFG.anim){const x=(o&&typeof o=='object')?Object.assign({},o):{};x.duration=1;x.delay=0;x.endDelay=0;x.iterations=1;o=x}
  return _an.call(this,kf,o)}}
applyAnim();

/* ---------- interfaz ---------- */
const GEAR='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
const has=sec=>{const m=window.MT&&window.MT.meta||{};return Object.keys(m).some(k=>secOf(k)==sec)};
const sw=(id,on,fn)=>`<input type="checkbox" class="cfg-sw" id="${id}" ${on?'checked':''} onchange="${fn}" aria-label="Activar o desactivar">`;
function render(){
 let w=document.getElementById('cfgw');if(!w)return;
 const keep=w.querySelector('.cfg-p')?w.querySelector('.cfg-p').scrollTop:0;
 const fxOn=typeof SND!=='undefined'?SND.on:true,fxV=typeof SND!=='undefined'?Math.round(SND.vol*100):50,mm=Math.round((window.cfgMaster?window.cfgMaster():.6)*100);
 w.innerHTML=`<div class="cfg-p" role="dialog" aria-label="Configuración">
 <div class="cfg-h"><h1>Configuración</h1><button class="cfg-x" onclick="CFGU.close()" aria-label="Cerrar">✕</button></div>
 <div class="m cfg-ver">Versión ${window.APP_VERSION}</div>
 <span class="m">Se guarda en este dispositivo y vale para todas tus partidas.</span>
 <div class="cfg-s">Música</div>
 <div class="cfg-r"><div class="cfg-t"><b>Volumen general</b></div><div class="cfg-v"><input type="range" min="0" max="100" value="${mm}" oninput="CFGU.master(this.value)" aria-label="Volumen general de la música"><span id="cfgv-m">${mm}%</span></div></div>
 ${SECS.map(([k,n,d])=>{const s=CFG.mus[k];return `<div class="cfg-r"><div class="cfg-t"><span><b>${n}</b><small>${d}${has(k)?'':' · aún sin canción'}</small></span>${sw('cfgs-'+k,s.on,`CFGU.sec('${k}',this.checked)`)}</div><div class="cfg-v"><input type="range" min="0" max="100" value="${s.v}" ${s.on?'':'disabled'} id="cfgr-${k}" oninput="CFGU.secV('${k}',this.value)" aria-label="Volumen de ${n}"><span id="cfgv-${k}">${s.v}%</span></div></div>`}).join('')}
 <div class="cfg-s">Efectos de sonido</div>
 <div class="cfg-r"><div class="cfg-t"><span><b>Efectos</b><small>Alertas, fiestas, derrotas y avisos</small></span>${sw('cfgfx',fxOn,'CFGU.fx(this.checked)')}</div><div class="cfg-v"><input type="range" min="0" max="100" value="${fxV}" ${fxOn?'':'disabled'} id="cfgr-fx" oninput="CFGU.fxV(this.value)" onchange="CFGU.test()" aria-label="Volumen de efectos"><span id="cfgv-fx">${fxV}%</span></div></div>
 <div class="cfg-r"><div class="cfg-t"><span><b>Vibración</b><small>En las alertas de invasión (celulares)</small></span>${sw('cfgvib',CFG.vib,'CFGU.vib(this.checked)')}</div></div>
 <div class="cfg-s">Visual</div>
 <div class="cfg-r"><div class="cfg-t"><span><b>Animaciones</b><small>Fuegos artificiales, partículas, destellos y transiciones. Apágalas si el juego va lento.</small></span>${sw('cfganim',CFG.anim,'CFGU.anim(this.checked)')}</div></div>
 <div class="cfg-f"><button onclick="CFGU.reset()">Restablecer</button><button class="pri" onclick="CFGU.close()">Listo</button></div></div>`;
 const p=w.querySelector('.cfg-p');if(p)p.scrollTop=keep}
const $i=id=>document.getElementById(id);
window.CFGU={
 open(){if($i('cfgw'))return;const w=document.createElement('div');w.id='cfgw';w.onclick=e=>{if(e.target===w)CFGU.close()};document.body.appendChild(w);render()},
 close(){const w=$i('cfgw');if(w)w.remove();save()},
 master(v){window.mtVol&&window.mtVol(+v);const e=$i('cfgv-m');if(e)e.textContent=Math.round(v)+'%'},
 sec(k,on){CFG.mus[k].on=!!on;save();applyMusic();const r=$i('cfgr-'+k);if(r)r.disabled=!on},
 secV(k,v){CFG.mus[k].v=+v;save();applyMusic();const e=$i('cfgv-'+k);if(e)e.textContent=Math.round(v)+'%'},
 fx(on){if(typeof SND!=='undefined'){SND.on=!!on;sndSave()}const r=$i('cfgr-fx');if(r)r.disabled=!on;if(on)CFGU.test()},
 fxV(v){if(typeof SND!=='undefined'){SND.vol=v/100;sndSave()}const e=$i('cfgv-fx');if(e)e.textContent=Math.round(v)+'%'},
 test(){try{snd('aviso')}catch(_){}},
 vib(on){CFG.vib=!!on;save();if(on){try{navigator.vibrate&&navigator.vibrate(60)}catch(_){}}},
 anim(on){CFG.anim=!!on;save();applyAnim()},
 reset(){if(!confirm('¿Restablecer toda la configuración de sonido y animaciones?'))return;
  const d=def();CFG.mus=d.mus;CFG.anim=d.anim;CFG.vib=d.vib;save();
  if(window.mtVol)window.mtVol(60);if(typeof SND!=='undefined'){SND.on=true;SND.vol=.5;sndSave()}
  applyMusic();applyAnim();render()}};
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&$i('cfgw'))CFGU.close()});

/* botón en la ciudad (encabezado) */
function mkHeaderBtn(){const mb=$i('mb');if(!mb||$i('cfgb'))return;const b=document.createElement('button');b.id='cfgb';b.setAttribute('aria-label','Configuración');b.title='Configuración';b.innerHTML=GEAR;b.onclick=()=>CFGU.open();mb.insertAdjacentElement('afterend',b)}
mkHeaderBtn();
/* botón flotante durante combates y pantallas completas (el encabezado queda tapado) */
{const f=document.createElement('button');f.id='cfgf';f.setAttribute('aria-label','Configuración');f.title='Configuración';f.innerHTML=GEAR;f.onclick=()=>CFGU.open();document.body.appendChild(f);
 setInterval(()=>{const g=$i('game'),inGame=g&&!g.classList.contains('hide'),full=inGame&&document.querySelector('#ov .scr, #pvb');f.style.display=(full&&!$i('cfgw'))?'flex':'none'},400)}
/* botón en la pantalla de partidas */
function slotBtn(){const s=$i('slots');if(!s||$i('cfgsl'))return;const d=document.createElement('div');d.style.cssText='margin-top:22px;text-align:center';d.id='cfgsl';d.innerHTML=`<button class="cfg-slotb" onclick="CFGU.open()">${GEAR}<span>Configuración</span></button>`;s.appendChild(d)}
try{const _s=slots;slots=function(){const r=_s.apply(this,arguments);slotBtn();return r}}catch(_){}
slotBtn();
})();
</script>

<script id="patch-demon-js">
/* ===== INVASIONES DEMONÍACAS (parte 2): desde que superas el nivel 60 =====
   · Intervalo entre invasiones: 6 a 10 minutos (antes 20 a 30).
   · Si pierdes: -45 % de solar, filar y recursos y -15 % de cristales mágicos y demás objetos.
   · Aldeanos (en campamento, libres o en torre mineral): 2 % de que mueran 2-3 y 10 % de que mueran 1-2.
   · Guarda la gravedad de la derrota (S.ivrep.sev, de 0 a 1) para que la parte 3 destruya edificios. */
(function(){
'use strict';
const DEM={lv:60,gap:[360000,600000],resPct:.45,objPct:.15,pSevere:.02,pMild:.10};
const RES=['solar','filar','recursos'];
const OBJ=[['piedra','piedra mágica','piedras mágicas'],['cristal','cristal mágico','cristales mágicos'],['polvo','polvo arcano','polvo arcano'],['nucleo','núcleo','núcleos'],['esencia','esencia','esencias']];
const RN={solar:'solares',filar:'filares',recursos:'recursos'};
const demOn=()=>!!(typeof S!=='undefined'&&S&&S.done&&S.done['L'+DEM.lv]);
window.demOn=demOn;

/* intervalo corto una vez superado el nivel 60 */
Object.defineProperty(IVC,'gap',{configurable:true,get:()=>demOn()?DEM.gap:[1200000,1800000]});

/* primera vez: avisa y acorta la espera que ya estuviera programada */
setInterval(()=>{try{
 if(!demOn()||S.dem||$('game').classList.contains('hide'))return;
 S.dem=1;const n=Date.now();
 if(S.ivnext&&!S.iv)S.ivnext=Math.min(S.ivnext,n+DEM.gap[0]+Math.floor(Math.random()*(DEM.gap[1]-DEM.gap[0])));
 save();notice('Invasiones demoníacas','Superaste el nivel 60: ahora llegan cada 6 a 10 minutos y, si pierdes, el saqueo es brutal y puedes perder aldeanos.')}catch(e){}},2000);

/* marca cada invasión nueva como demoníaca */
{const _p=ivPlan;ivPlan=function(){const had=!!(S&&S.iv);_p.apply(this,arguments);if(S&&S.iv&&!had&&demOn()&&!S.iv.dem){S.iv.dem=true;save()}}}

/* textos del aviso */
{const _n=notice;notice=function(t,x){if(t==='¡Invasión en camino!'&&demOn())x='Invasión demoníaca: '+x;return _n.call(this,t,x)}}
{const _u=ivUI;ivUI=function(){const r=_u.apply(this,arguments);try{const iv=S&&S.iv;if(iv&&iv.dem){
  const h=document.querySelector('#ov h2');if(h&&/inminente/i.test(h.textContent))h.textContent='Invasión demoníaca';
  const p=document.querySelector('#ov p.hint');if(p)p.textContent=iv.dem&&ivDef(iv).t>=ivAtk(iv)?'Con esta defensa la ciudad resistiría.':'Si pierdes: -45 % de solar, filar y recursos, -15 % de cristales y demás objetos, y podrías perder aldeanos.'}}catch(e){}return r}}
setInterval(()=>{try{const b=document.getElementById('iva');if(b&&S&&S.iv&&S.iv.dem&&/^Invasión /.test(b.textContent))b.textContent=b.textContent.replace(/^Invasión /,'Demoníaca ')}catch(e){}},400);

/* aldeanos que mueren: se eligen al azar entre los de campamento, torre mineral y libres */
function killVillagers(n){const out={cam:0,min:0,free:0};
 for(let i=0;i<n&&S.pop>0;i++){
  const free=Math.max(0,S.pop-used()),pool=[];
  S.b.forEach(b=>{if((b.rest||0)>0)pool.push(['rest',b,b.rest]);if((b.w||0)>0)pool.push(['w',b,b.w])});
  let r=Math.random()*(free+pool.reduce((a,p)=>a+p[2],0));
  if(r<free)out.free++;
  else{r-=free;for(const p of pool){if(r<p[2]){p[1][p[0]]--;out[p[0]=='rest'?'cam':'min']++;break}r-=p[2]}}
  S.pop--}
 habSync();return out}
function villagerRoll(){const r=Math.random();
 if(r<DEM.pSevere)return 2+Math.floor(Math.random()*2);   /* 2 a 3 */
 if(r<DEM.pSevere+DEM.pMild)return 1+Math.floor(Math.random()*2); /* 1 a 2 */
 return 0}

/* resolución */
{const _r=ivResolve;ivResolve=function(){
  const iv=S&&S.iv,t0=S&&S.ivrep&&S.ivrep.t;
  const pre=iv&&iv.dem?JSON.parse(JSON.stringify({c:S.coins,i:S.inv})):null;
  let d=null,a=0;if(iv&&iv.dem){try{d=ivDef(iv);a=ivAtk(iv)}catch(e){}}
  const res=_r.apply(this,arguments);
  try{const r=S&&S.ivrep;
   if(!pre||!r||r.t===t0||S.iv)return res;
   r.dem=true;
   if(r.win){save();return res}
   /* derrota demoníaca: se deshace la pérdida normal y se aplica la demoníaca */
   const L=r.L.slice(0,2),loss={},oloss={};
   RES.forEach(k=>{const v=Math.floor(pre.c[k]||0),l=Math.floor(v*DEM.resPct);S.coins[k]=Math.max(0,(pre.c[k]||0)-l);loss[k]=l});
   OBJ.forEach(([k])=>{const v=Math.floor(pre.i[k]||0);if(v>0){const l=Math.min(v,Math.max(1,Math.ceil(v*DEM.objPct)));S.inv[k]=v-l;oloss[k]=l}});
   const nd=villagerRoll(),dead=nd?killVillagers(nd):{cam:0,min:0,free:0},tot=dead.cam+dead.min+dead.free;
   r.sev=a>0?Math.max(0,Math.min(1,(a-(d?d.t:0))/a)):1;S.lastSev=r.sev;
   L.push('Las hordas demoníacas arrasaron la ciudad.');
   L.push('Saqueo (-45 %): '+RES.map(k=>'-'+loss[k]+' '+RN[k]).join(', ')+'.');
   const ol=OBJ.filter(([k])=>oloss[k]).map(([k,s,p])=>'-'+oloss[k]+' '+(oloss[k]==1?s:p));
   L.push(ol.length?'Objetos perdidos (-15 %): '+ol.join(', ')+'.':'No tenías objetos que perder.');
   if(tot){const w=[];if(dead.cam)w.push(dead.cam+' en campamento');if(dead.min)w.push(dead.min+' en torre mineral');if(dead.free)w.push(dead.free+' libre'+(dead.free>1?'s':''));
    L.push('Aldeanos muertos: '+tot+' ('+w.join(', ')+').');
    S.mlog=S.mlog||[];S.mlog.unshift('Murieron '+tot+' aldeano'+(tot>1?'s':'')+' en una invasión demoníaca')}
   else L.push('Ningún aldeano murió.');
   if(iv.hero)L.push('Los héroes defensores quedaron heridos (nunca mueren).');
   r.L=L;save();draw();ivReport();
   try{notice('Invasión demoníaca perdida','Pérdidas: '+RES.map(k=>loss[k]+' '+RN[k]).join(', ')+(tot?' · '+tot+' aldeano'+(tot>1?'s':'')+' muerto'+(tot>1?'s':''):''))}catch(e){}
  }catch(e){console.error(e)}
  return res}}

/* informe con título demoníaco */
{const _rp=ivReport;ivReport=function(){const r=S&&S.ivrep;if(r&&r.dem){
  modal(`<div class="uh"><div class="ib big">${ic('mur',30)}</div><div class="uhi"><h2>Invasión demoníaca</h2><span class="m">${r.win?'✓ Victoria':'✕ Derrota'}</span></div></div><!--E-->
  <div class="reqs">${r.L.map(x=>`<div class="req ${r.win?'ok':''}"><span>${x}</span></div>`).join('')}</div>`);return}
  return _rp.apply(this,arguments)}}
window.__DEM=DEM;
})();
</script>

<script id="patch-wreck-js">
/* ===== EDIFICIOS DESTRUIDOS (parte 3) =====
   · Tras perder una invasión demoníaca se destruyen edificios según lo que faltó de defensa (S.ivrep.sev, 0 a 1):
     faltó casi todo → la mayoría; faltó poco → uno o ninguno. El establecimiento central y las decoraciones/caminos no se destruyen.
   · Un edificio destruido se ve gris, agrietado y con humo, deja de funcionar (se trata como «no construido») y libera a sus trabajadores.
   · Repararlo cuesta cristales mágicos + diamantino, más caro cuanto más alto es su nivel (muros: la mitad). */
(function(){
'use strict';
const FAR=8640000000000000; /* fecha máxima: «aún no construido» y válida en JSON */
const RP={cr:2,dia:2,wall:1};
const repCost=b=>{const l=L(b);return b.type=='mur'?{cristal:RP.wall*l,diamantino:RP.wall*l}:{cristal:RP.cr*l,diamantino:RP.dia*l+1}};
const canPay=c=>(S.inv.cristal||0)>=c.cristal&&(S.coins.diamantino||0)>=c.diamantino;
const dead=()=>S.b.filter(b=>b.dead);
window.wreckList=dead;

function wreckBuildings(sev){
 const n0=Date.now(),el=S.b.filter(b=>b.type!='est'&&!DECO.includes(b.type)&&!b.dead&&n0>=b.end);
 const exp=el.length*0.8*Math.pow(Math.max(0,Math.min(1,sev)),1.3);
 let k=Math.floor(exp)+(Math.random()<exp-Math.floor(exp)?1:0);k=Math.min(k,el.length);
 for(let i=el.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[el[i],el[j]]=[el[j],el[i]]}
 const hit=el.slice(0,k);
 hit.forEach(b=>{b.dead=1;b.end0=b.end;b.end=FAR;b.d=b.d||1;b.rest=0;b.w=0;delete b.nl});
 return hit}

/* ---------- aspecto: gris, grietas, escombros, humo y marca roja ---------- */
const WRECK='<span class="wreck"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M48 14 41 34 52 46 43 62 54 78" fill="none" stroke="#120b08" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M52 46 68 52 74 68" fill="none" stroke="#120b08" stroke-width="2" stroke-linecap="round"/><path d="M14 90 22 78 32 86 42 76 52 88 64 78 76 87 86 80 90 92z" fill="#4b4642" stroke="#120b08" stroke-width="1.5" stroke-linejoin="round"/><circle cx="82" cy="18" r="12" fill="#c0392b" stroke="#fff" stroke-width="2"/><path d="M82 11v9" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="82" cy="25" r="1.8" fill="#fff"/></svg><i class="wsm"></i><i class="wsm s2"></i></span>';
function paintWrecks(){if(!S||!G)return;
 G.forEach((c,i)=>{const b=cell(i%15,(i/15)|0);
  if(b&&b.dead){
   if(!c.classList.contains('wr'))c.classList.add('wr');
   const sp=c.firstChild;
   if(sp&&!c.querySelector('.wreck')){
    sp.classList.add('wk');if(sp.firstChild&&sp.firstChild.style)sp.firstChild.style.opacity='';
    const p=c.querySelector('.prog');if(p)p.remove();
    const lv=c.querySelector('.lv');
    c.insertAdjacentHTML('beforeend',WRECK)}
  }else if(c.classList.contains('wr'))c.classList.remove('wr')})}

<script id="patch-rows-js">
(function(){

function reflow(){

 M.querySelectorAll('.sqrl').forEach(x=>x.remove());H.querySelectorAll('.sqrl').forEach(x=>x.remove());
 /* monstruos: Yloka arriba; delante sus invocaciones. Primera línea al centro, retaguardia a los lados (solo los visibles) */
 const all=SQ.m.map((m,i)=>{const e=document.getElementById('sqm'+i);return e&&{e,back:e.classList.contains('sq-bk'),gone:e.classList.contains('gone'),top:m.n=='Yloka'}}).filter(Boolean);
 const tops=all.filter(x=>x.top&&!x.gone),items=all.filter(x=>!x.top&&!x.gone),rest=all.filter(x=>x.gone),n=items.length;
 const order=[...items.filter(x=>!x.back),...items.filter(x=>x.back)],idx=centerOrder(n),slots=new Array(n);
 order.forEach((x,k)=>slots[idx[k]]=x);
 const want=[...tops.map(x=>x.e),...slots.map(x=>x.e),...rest.map(x=>x.e)],have=Array.from(M.children);
 if(!same(want,have))want.forEach(e=>M.appendChild(e));

 /* héroes: en el orden de la escuadra; la retaguardia se retrasa */

<script id="patch-recenter-js">
